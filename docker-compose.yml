
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ignis-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ignis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ignis_db

    ports:
         - "127.0.0.1:5433:5432"

    volumes:
      - ignis_pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ignis -d ignis_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ignis_pgdata:
